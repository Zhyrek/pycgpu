[build-system]
requires = [
    "Cython",
    "numpy>=2",
    "scipy",
    "setuptools",
    "setuptools_scm[toml]>=6.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "pycalphad"
authors = [
    {name = "Richard Otis", email = "richard.otis@outlook.com"},
    {name = "Brandon Bocklund", email = "brandonbocklund@gmail.com"},
]
description = "CALPHAD tools for designing thermodynamic models, calculating phase diagrams and investigating phase equilibria."
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
# NOTE: please try to keep any depedencies in alphabetic order so they
# may be easily compared with other dependency lists
# NOTE: these dependencies may differ in name from those in the
# conda-forge Anaconda channel. For example, conda-forge/symengine
# gives the C++ SymEngine library, while conda-forge/python-symengine
# provides the Python package called `symengine`.
dependencies = [
    "matplotlib>=3.3",
    "numpy>=1.13",
    "pint",
    "pyparsing>=3.0",
    "pytest-cov",
    "pytest",
    "runtype",
    "scipy",
    "setuptools_scm[toml]>=6.0",
    "symengine>=0.9.2,<0.14",
    "tinydb>=3.8",
    "typing_extensions",
    "xarray>=0.11.2",
]

# Static version (fork policy): dynamic setuptools_scm versioning reports
# 0.0.0 whenever the plugin cannot run — tag-less snapshots, and notably
# --no-build-isolation builds where setuptools_scm is not installed, in
# which case plain setuptools supplies the 0.0.0 default and pip may then
# evict this package for failing downstream version floors (ESPEI requires
# pycalphad>=0.11.0). The branch contains the upstream 0.11.2 release; bump
# the post number when pushing user-facing changes.
version = "0.11.2.post22"

[project.urls]
Homepage = "https://pycalphad.org/"

[dependency-groups]
dev = [
    "Cython",
    "docutils<0.21", # workaround for https://github.com/vidartf/nbsphinx-link/issues/22
    "furo>=2021.11.16",  # docs theme
    "ipykernel",
    "ipython",  # for pygments syntax highlighting
    "jupyter>=1.1.1",
    "nb-clean>=4.0.1",
    "nbconvert>=7.17.1",
    "nbsphinx-link",
    "numpy>=2",
    "pytest-cov",
    "scipy",
    "setuptools_scm[toml]>=6.0",
    "setuptools",
    "sphinx<9",
    "sphinx-autobuild>=2025.8.25",
    "wheel",
]

[project.optional-dependencies]
# Compiled backends (pycalphad.set_backend). The 'cpp' backend needs no Python
# dependencies: generated kernels compile at runtime with the system C++17
# compiler (Xcode command line tools on macOS, g++ on Linux, MinGW-w64 or WSL
# on Windows), which pip cannot install. The Metal backend (Apple silicon)
# uses the same compiler and the system Metal framework. The CUDA backend
# needs CuPy; its wheels bundle the CUDA runtime (an NVIDIA driver is still
# required). CUDA 11 users should install cupy-cuda11x instead; AMD ROCm users
# can try the experimental cupy-rocm wheels. See BACKENDS.md.
cpp = []
gpu = ["cupy-cuda12x; sys_platform != 'darwin'"]
# pycalphad.densegrid (tiled grids streamed to a Zarr store)
densegrid = ["zarr>=3"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    # ensure we rebuild if our Cython files or build script changes
    { file = "setup.py" },
    { file = "**/*.pyx" },
    { file = "**/*.pxd" },
]

[tool.setuptools]
# Do not include pycalphad._dev here as it should not be distributed
packages = [
    "pycalphad.cg",
    "pycalphad.codegen",
    "pycalphad.core",
    "pycalphad.densegrid",
    "pycalphad.gpu",
    "pycalphad.io",
    "pycalphad.mapping.strategy",
    "pycalphad.mapping",
    "pycalphad.models",
    "pycalphad.plot.binary",
    "pycalphad.plot",
    "pycalphad.property_framework",
    "pycalphad.tests.databases",
    "pycalphad.tests",
    "pycalphad",
]

[tool.setuptools.package-data]
"pycalphad.core" = ["*.pxd"]
"pycalphad.tests.databases" = ["*"]

[tool.pytest.ini_options]
markers = [
    "solver: mark for tests that verify the correctness of the solver",
]
norecursedirs = ["pycalphad/_dev"]
filterwarnings = [
    "error",
    "ignore:The type definition character*:UserWarning",
    "ignore:__array__ implementation doesn't accept a copy keyword, so passing copy=False failed.", # https://github.com/pydata/xarray/issues/9400
]

[tool.coverage.paths]
# The first path is the path to the modules to report coverage against.
# All following paths are patterns to match against the collected data.
# Any matches will be combined with the first path for coverage.
source = [
    "./pycalphad",
    "*/lib/*/site-packages/pycalphad",  # allows testing against site-packages for a local virtual environment
]

[tool.coverage.run]
plugins = [
    "Cython.Coverage",
]
# Only consider coverage for these packages:
source_pkgs = [
    "pycalphad"
]
omit = [
    "pycalphad/core/*.pxd", # workaround for https://github.com/nedbat/coveragepy/issues/972
    "*/pycalphad/tests/*", # don't include tests in coverage
    "stringsource",
    "*/numpy/*",  # fix for Cython.Coverage.Plugin did not provide a file reporter for numpy/__init__.cython-30.pxd
]

[tool.coverage.report]
ignore_errors = true # workaround for https://github.com/cython/cython/issues/5581
